<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex"><title>River Room — Player Administration</title><link rel="stylesheet" href="../styles.css"><style>
body{padding:1rem;max-width:68rem;margin:auto}.admin-header{display:flex;justify-content:space-between;align-items:center;gap:1rem}.admin-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:1rem}.admin-card{background:#142629;padding:1.2rem;border:1px solid #304644;border-radius:12px}.admin-card label{display:block;margin:.8rem 0}.admin-card input[type=text]{width:100%;padding:.5rem;background:#09191a;color:white;border:1px solid #80938b;border-radius:5px}.admin-card input[type=range]{width:100%}.admin-card output{float:right}.actions{display:flex;gap:1rem;margin:1rem 0;flex-wrap:wrap}.status{min-height:1.5rem}.subtle{color:#b9c9bd}button{cursor:pointer}
